      "Authors@R": "c( person(given = 'Mari', family = 'Myllymäki', role = c('aut', 'cre'), email = 'mari.myllymaki@luke.fi', comment = c(ORCID = \"0000-0002-2713-7088\")), person(given = 'Tomáš', family = 'Mrkvička', role = 'aut', email = 'mrkvicka.toma@gmail.com'), person(given = 'Mikko', family = 'Kuronen', role = 'ctb', email = 'mikko.kuronen@luke.fi'), person(given = 'Jiří', family = 'Dvořák', role = 'ctb', email = 'dvorak@karlin.mff.cuni.cz'), person(given = 'Pavel', family = 'Grabarnik', role = 'ctb', email = 'gpya@rambler.ru'), person(given = 'Ute', family = 'Hahn', role = 'ctb', email = 'ute@math.au.dk'), person(given = 'Michael', family = 'Rost', role = 'ctb', email = 'rost@ef.jcu.cz'), person(given = 'Henri', family = 'Seijo', role = 'ctb', email = 'henri.seijo@iki.fi') )",
